<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quicksilver arc — 1 bit in, 1px out</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070f; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { width: min(1000px, 100vw); }
  canvas { width: 100%; height: auto; display: block; }
  #bar { display: flex; gap: 8px; padding: 10px 12px; flex-wrap: wrap; align-items: center; }
  button { background: #0e1626; color: #9fd8e8; border: 1px solid #1f3a4d; border-radius: 8px;
           padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #16233a; }
  button.on { border-color: #2dd4bf; color: #2dd4bf; }
  #note { color: #5b6b82; font-size: 12px; padding: 0 12px 12px; }
</style>
<style id="cubit-neon">
:root{--neon-cyan:#00f0ff;--neon-pink:#ff2bd6;--neon-amber:#ffb300}
html,body{background:#030308;color:#d7e3f5;font-family:ui-monospace,Menlo,monospace}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 400px at 20% 10%, rgba(0,240,255,.06), transparent 70%),
  radial-gradient(700px 500px at 80% 90%, rgba(255,43,214,.05), transparent 70%)}
main,#wrap{position:relative;z-index:1;background:rgba(5,8,16,.78);color:#d7e3f5;
  border:1px solid rgba(0,240,255,.18);border-radius:14px;
  box-shadow:0 0 34px rgba(0,240,255,.07), inset 0 0 60px rgba(0,0,0,.45)}
#wrap{max-width:1340px;margin:0 auto;padding:34px 18px 50px;text-align:center}
h1{font-size:26px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:#eaf6ff;
  text-shadow:0 0 8px var(--neon-cyan), 0 0 28px rgba(0,240,255,.7);animation:cubitflicker 7s infinite}
#sub{font-size:11px;letter-spacing:.3em;color:#5f7396;text-transform:uppercase;margin-bottom:26px}
#sub b{color:var(--neon-pink);font-weight:400;text-shadow:0 0 10px var(--neon-pink)}
#stage{display:flex;gap:26px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.panel{border:1px solid rgba(0,240,255,.18);border-radius:14px;padding:18px 14px 14px;
  background:rgba(5,8,16,.72);box-shadow:0 0 34px rgba(0,240,255,.07), inset 0 0 60px rgba(0,0,0,.5);
  flex:1 1 420px;max-width:640px;text-align:left}
.panel.neon{border-color:rgba(255,43,214,.25);box-shadow:0 0 34px rgba(255,43,214,.08), inset 0 0 60px rgba(0,0,0,.5)}
.panel h2{font-size:12px;font-weight:400;letter-spacing:.4em;text-transform:uppercase;margin:0 0 2px;color:#a5e8eb}
.panel.neon h2{color:#ffb3ec;text-shadow:0 0 12px var(--neon-pink)}
.panel .tag{font-size:10px;letter-spacing:.12em;color:#5f7396;text-transform:uppercase;margin-bottom:12px}
#v3{background:#05070d;border-radius:14px;box-shadow:0 0 0 3px var(--neon-pink), 0 0 28px rgba(255,43,214,.25)}
button{font-family:inherit;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:#a5e8eb;
  border:1px solid rgba(0,240,255,.4);border-radius:18px;box-shadow:0 0 12px rgba(0,240,255,.15)}
button:hover{background:rgba(0,240,255,.1)}
#controls{margin-top:26px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
a{color:var(--neon-cyan)}
code{color:#ffb3ec}
section{background:rgba(5,8,16,.55);border:1px solid rgba(255,43,214,.25);color:#d7e3f5}
.card{background:rgba(5,8,16,.78);color:#d7e3f5;border:1px solid rgba(0,240,255,.18)}
.th{background:#030308}
#board,#chart{background:rgba(5,8,16,.85);color:#d7e3f5}
main p,main li,#wrap p,#wrap li{color:#d7e3f5}
h2,h3{color:#a5e8eb}
.q{border-left-color:var(--neon-pink)}
body.thumb main,body.thumb #wrap{background:#030308;box-shadow:none;border:0}
body.thumb .panel:not(.neon),body.thumb #sub,body.thumb #controls,body.thumb .essay{display:none}
body.thumb #stage{display:block}
body.thumb #v3{height:78vh}
@keyframes cubitflicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}97%{opacity:.85}98%{opacity:1}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style></head>
<body>
<div id="wrap">
  <canvas id="c" width="1000" height="600"></canvas>
  <div id="bar">
    <button id="bMoniker" class="on">moniker: 1</button>
    <button id="bDrop">drop the bit</button>
    <button id="bReplay">replay</button>
  </div>
  <div id="note">plank-line 31/31 · 52-bubble scale model of a packed line (~6.2e25 bubbles/nm) · the arc carries the bit itself; bubbles only attest · dark pixel = delivered 0 or lost — the ledger says which</div>
</div>
<script>
'use strict';
// Isomorph of ~/workspace/plank-bubbles/plank-line.js: same invariant
// (alternating 99u1d/99d1up line, arc-carry, ledger, 1px delivery), new medium.
const N = 52;                       // scale model of the packed line
const SEED = 7;
function rng32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// line: alternating nets, 1% cross-talk flags (read noise only)
const line = [];
{
  const rng = rng32(SEED);
  for (let i = 0; i < N; i++) {
    const up = i % 2 === 0;
    line.push({ i, net: up ? 98 : -98, cross: rng() < 0.01 });
  }
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const yLine = 210, x0 = 70, x1 = W - 170, dx = (x1 - x0) / (N - 1), R = 11;
const yThread = 360;                 // the watermark thread: under the line
const pxX = W - 95, pxY = yLine - 34, pxS = 68;  // the 1px

let S; // run state
function newRun(moniker, drop) {
  const rng = rng32(SEED + moniker); // cross-talk reads (never touch the bit)
  const cross = line.map(() => rng() < 0.01);
  const dropAt = drop ? 10 + Math.floor(rng() * (N - 20)) : -1;
  return { moniker, pos: -1, bit: moniker, delivered: true, ledger: [],
           cross, dropAt, lostAt: -1, t: 0, phase: 'travel', flash: new Array(N).fill(0) };
}
function step() {
  if (S.phase !== 'travel') return;
  S.pos += 0.35;                     // arc speed
  const k = Math.floor(S.pos);
  if (k >= 0 && k < N && !S.ledger.includes(k)) {
    S.ledger.push(k); S.flash[k] = 1; // attribution taken
    if (k === S.dropAt) { S.bit = -1; S.delivered = false; S.lostAt = k; }
  }
  for (let i = 0; i < N; i++) S.flash[i] *= 0.94;
  if (S.pos >= N - 1 + 6) S.phase = 'done';
}
function bubbleColor(net, flash, cross) {
  const base = net > 0 ? [212, 175, 55] : [139, 92, 246]; // 99u1d gold / 99d1up violet
  const f = Math.min(1, flash + (cross ? 0.25 : 0));
  return `rgb(${base.map(v => Math.round(v + (255 - v) * f * 0.7)).join(',')})`;
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  // backdrop
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070b16'); g.addColorStop(1, '#04060d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8fa3bd'; ctx.font = '15px system-ui';
  ctx.fillText('packed line — 52 Planck bubbles, alternating 99u1d / 99d1up', x0, 40);
  ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
  ctx.fillText('plank-line 31/31 · 1 bit in → 1px out', x0, 62);

  // bubbles
  for (let i = 0; i < N; i++) {
    const x = x0 + i * dx, b = line[i];
    ctx.beginPath(); ctx.arc(x, yLine, R, 0, 7);
    ctx.fillStyle = bubbleColor(b.net, S.flash[i], b.cross && Math.abs(S.pos - i) < 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,180,210,0.25)'; ctx.stroke();
    if (S.ledger.includes(i)) { // attest tick
      ctx.fillStyle = '#2dd4bf'; ctx.font = '10px system-ui';
      ctx.fillText('✓', x - 3, yLine - R - 6);
    }
  }
  // arc
  if (S.phase === 'travel') {
    const ax = x0 + Math.min(S.pos, N - 1) * dx;
    const ag = ctx.createRadialGradient(ax, yLine, 0, ax, yLine, 26);
    ag.addColorStop(0, 'rgba(45,212,191,0.9)'); ag.addColorStop(1, 'rgba(45,212,191,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(ax, yLine, 26, 0, 7); ctx.fill();
    ctx.fillStyle = '#eafffb'; ctx.beginPath(); ctx.arc(ax, yLine, 5, 0, 7); ctx.fill();
  }
  // watermark thread — under the line, sub-Planckian
  ctx.strokeStyle = 'rgba(45,212,191,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, yThread); ctx.lineTo(x1, yThread); ctx.stroke();
  ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
  ctx.fillText('quicksilver thread · 1 bit · ~1.1502e-36 m · under the 1% cross-talk floor — never caught', x0, yThread + 28);
  if (S.phase === 'travel' && S.bit !== -1) { // the bit rides the thread
    const bx = x0 + Math.min(S.pos, N - 1) * dx;
    ctx.fillStyle = S.moniker ? '#ffffff' : '#1f6f65';
    ctx.beginPath(); ctx.arc(bx, yThread, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#2dd4bf'; ctx.font = '12px system-ui';
    ctx.fillText('1 bit', bx + 10, yThread + 4);
  }
  if (S.lostAt >= 0 && S.phase !== 'done') {
    const lx = x0 + S.lostAt * dx;
    ctx.fillStyle = '#f87171'; ctx.font = '13px system-ui';
    ctx.fillText('bit lost here', lx - 30, yThread - 16);
  }
  // the 1px
  const lit = S.phase === 'done' && S.delivered;
  const dark = S.phase === 'done' && !S.delivered;
  ctx.fillStyle = '#0b1220'; ctx.fillRect(pxX, pxY, pxS, pxS);
  ctx.strokeStyle = '#1f3a4d'; ctx.strokeRect(pxX, pxY, pxS, pxS);
  if (lit) {
    ctx.fillStyle = S.moniker ? '#eafffb' : '#123f3a';
    ctx.fillRect(pxX + 4, pxY + 4, pxS - 8, pxS - 8);
  }
  ctx.fillStyle = '#8fa3bd'; ctx.font = '14px system-ui';
  ctx.fillText('1px', pxX + 22, pxY + pxS + 22);
  if (S.phase === 'done') {
    ctx.font = '15px system-ui';
    if (S.delivered) {
      ctx.fillStyle = '#2dd4bf';
      ctx.fillText(`delivered: moniker ${S.moniker} → 1px lit=${S.moniker ? 'bright' : 'dark-but-honest'} · ledger ${S.ledger.length}/${N} attests`, x0, 480);
      if (S.moniker === 0) {
        ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
        ctx.fillText('dark pixel, full ledger — this is a delivered 0, not a loss. the ledger says which.', x0, 504);
      }
    } else {
      ctx.fillStyle = '#f87171';
      ctx.fillText(`bit lost at bubble ${S.lostAt} → 1px dark · no receipt (ledger kept walking: ${S.ledger.length}/${N})`, x0, 480);
    }
  }
  // ledger strip
  ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
  ctx.fillText(`ledger: ${S.ledger.length}/${N} attests`, x0, 545);
  ctx.fillStyle = '#2dd4bf';
  const tail = S.ledger.slice(-14);
  tail.forEach((k, j) => ctx.fillText((line[k].net > 0 ? '+' : '') + line[k].net, x0 + 170 + j * 52, 545));

  step();
  requestAnimationFrame(draw);
}
// controls
const bM = document.getElementById('bMoniker');
const bD = document.getElementById('bDrop');
const bR = document.getElementById('bReplay');
let moniker = 1, willDrop = false;
bM.onclick = () => { moniker ^= 1; bM.textContent = 'moniker: ' + moniker;
  bM.classList.toggle('on', !!moniker); S = newRun(moniker, willDrop); };
bD.onclick = () => { willDrop = !willDrop; bD.classList.toggle('on', willDrop);
  bD.textContent = willDrop ? 'drop armed' : 'drop the bit'; S = newRun(moniker, willDrop); };
bR.onclick = () => { S = newRun(moniker, willDrop); };
S = newRun(moniker, false);
requestAnimationFrame(draw);
</script>
</body>
</html>
