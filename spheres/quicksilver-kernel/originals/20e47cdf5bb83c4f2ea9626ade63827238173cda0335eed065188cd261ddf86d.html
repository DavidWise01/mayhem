<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quicksilver arc — 11 across, 2px out</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070f; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { width: min(1000px, 100vw); }
  canvas { width: 100%; height: auto; display: block; }
  #bar { display: flex; gap: 8px; padding: 10px 12px; flex-wrap: wrap; align-items: center; }
  button { background: #0e1626; color: #9fd8e8; border: 1px solid #1f3a4d; border-radius: 8px;
           padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #16233a; }
  button.on { border-color: #2dd4bf; color: #2dd4bf; }
  #note { color: #5b6b82; font-size: 12px; padding: 0 12px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1000" height="640"></canvas>
  <div id="bar">
    <button id="bMoniker" class="on">moniker: 11</button>
    <button id="bDrop">drop: off</button>
    <button id="bReplay">replay</button>
  </div>
  <div id="note">plank-line 44/44 · 52-bubble scale model of a packed line (~6.2e25 bubbles/nm) · the arc carries the pair itself; bubbles only attest · dark pixel = delivered 0 or lost — the ledger says which</div>
</div>
<script>
'use strict';
// Isomorph of ~/workspace/plank-bubbles/plank-line.js: same invariant
// (alternating 99u1d/99d1up line, arc-carry of the pair, ledger, 2px delivery).
const N = 52;
const SEED = 7;
function rng32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const line = [];
{
  const rng = rng32(SEED);
  for (let i = 0; i < N; i++) {
    const up = i % 2 === 0;
    line.push({ i, net: up ? 98 : -98, cross: rng() < 0.01 });
  }
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const yLine = 200, x0 = 70, x1 = W - 220, dx = (x1 - x0) / (N - 1), R = 11;
const yThread = [350, 386];          // the pair rides two threads, under the line
const pxX = W - 170, pxY = yLine - 34, pxS = 60, pxGap = 12; // the 2px

let S;
function newRun(pair, dropMode) {
  const rng = rng32(SEED + pair[0] * 2 + pair[1]);
  const cross = line.map(() => rng() < 0.01);
  const dropAt = dropMode === 'off' ? -1 : 10 + Math.floor(rng() * (N - 20));
  return { pair: [pair[0], pair[1]], bits: [pair[0], pair[1]], pos: -1,
           delivered: true, ledger: [], cross, dropAt, dropMode,
           lost: [-1, -1], phase: 'travel', flash: new Array(N).fill(0) };
}
function step() {
  if (S.phase !== 'travel') return;
  S.pos += 0.35;
  const k = Math.floor(S.pos);
  if (k >= 0 && k < N && !S.ledger.includes(k)) {
    S.ledger.push(k); S.flash[k] = 1;
    if (k === S.dropAt) {
      const drop = S.dropMode === 'both' ? [0, 1] : [S.dropMode === 'A' ? 0 : 1];
      drop.forEach(d => { S.bits[d] = -1; S.lost[d] = k; });
      S.delivered = false;
    }
  }
  for (let i = 0; i < N; i++) S.flash[i] *= 0.94;
  if (S.pos >= N - 1 + 6) S.phase = 'done';
}
function bubbleColor(net, flash, cross) {
  const base = net > 0 ? [212, 175, 55] : [139, 92, 246];
  const f = Math.min(1, flash + (cross ? 0.25 : 0));
  return `rgb(${base.map(v => Math.round(v + (255 - v) * f * 0.7)).join(',')})`;
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070b16'); g.addColorStop(1, '#04060d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8fa3bd'; ctx.font = '15px system-ui';
  ctx.fillText('packed line — 52 Planck bubbles, alternating 99u1d / 99d1up', x0, 40);
  ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
  ctx.fillText('plank-line 44/44 · pair 11 in → 2px out', x0, 62);

  for (let i = 0; i < N; i++) {
    const x = x0 + i * dx, b = line[i];
    ctx.beginPath(); ctx.arc(x, yLine, R, 0, 7);
    ctx.fillStyle = bubbleColor(b.net, S.flash[i], b.cross && Math.abs(S.pos - i) < 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,180,210,0.25)'; ctx.stroke();
    if (S.ledger.includes(i)) {
      ctx.fillStyle = '#2dd4bf'; ctx.font = '10px system-ui';
      ctx.fillText('✓', x - 3, yLine - R - 6);
    }
  }
  if (S.phase === 'travel') {
    const ax = x0 + Math.min(S.pos, N - 1) * dx;
    const ag = ctx.createRadialGradient(ax, yLine, 0, ax, yLine, 26);
    ag.addColorStop(0, 'rgba(45,212,191,0.9)'); ag.addColorStop(1, 'rgba(45,212,191,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(ax, yLine, 26, 0, 7); ctx.fill();
    ctx.fillStyle = '#eafffb'; ctx.beginPath(); ctx.arc(ax, yLine, 5, 0, 7); ctx.fill();
  }
  // the pair rides two threads under the line
  const labels = ['A', 'B'];
  yThread.forEach((yt, d) => {
    ctx.strokeStyle = 'rgba(45,212,191,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, yt); ctx.lineTo(x1, yt); ctx.stroke();
    if (S.phase === 'travel' && S.bits[d] !== -1) {
      const bx = x0 + Math.min(S.pos, N - 1) * dx;
      ctx.fillStyle = S.pair[d] ? '#ffffff' : '#1f6f65';
      ctx.beginPath(); ctx.arc(bx, yt, 6, 0, 7); ctx.fill();
      ctx.fillStyle = '#2dd4bf'; ctx.font = '12px system-ui';
      ctx.fillText('1 bit ' + labels[d], bx + 10, yt + 4);
    }
    if (S.lost[d] >= 0) {
      const lx = x0 + S.lost[d] * dx;
      ctx.fillStyle = '#f87171'; ctx.font = '13px system-ui';
      ctx.fillText('bit ' + labels[d] + ' lost', lx - 28, yt - 14);
    }
  });
  ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
  ctx.fillText('quicksilver pair · 2 bits · ~1.1502e-36 m · under the 1% cross-talk floor — never caught', x0, yThread[1] + 30);

  // the 2px
  const px = (d) => {
    const X = pxX + d * (pxS + pxGap);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(X, pxY, pxS, pxS);
    ctx.strokeStyle = '#1f3a4d'; ctx.strokeRect(X, pxY, pxS, pxS);
    if (S.phase === 'done' && S.bits[d] !== -1) {
      ctx.fillStyle = S.pair[d] ? '#eafffb' : '#123f3a';
      ctx.fillRect(X + 4, pxY + 4, pxS - 8, pxS - 8);
    }
    ctx.fillStyle = '#8fa3bd'; ctx.font = '14px system-ui';
    ctx.fillText('1px ' + labels[d], X + 12, pxY + pxS + 22);
  };
  px(0); px(1);

  if (S.phase === 'done') {
    ctx.font = '15px system-ui';
    const shown = S.bits.map(b => b < 0 ? 0 : b).join('');
    if (S.delivered) {
      ctx.fillStyle = '#2dd4bf';
      ctx.fillText(`delivered: pair ${S.pair.join('')} → 2px ${shown} · ledger ${S.ledger.length}/${N} attests`, x0, 500);
      if (shown.includes('0')) {
        ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
        ctx.fillText('dark pixel, full ledger — a delivered 0, not a loss. the ledger says which.', x0, 524);
      }
    } else {
      ctx.fillStyle = '#f87171';
      ctx.fillText(`lost ${S.dropMode === 'both' ? 'both bits' : 'bit ' + S.dropMode} → 2px ${shown} · no receipt (ledger kept walking: ${S.ledger.length}/${N})`, x0, 500);
    }
  }
  ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
  ctx.fillText(`ledger: ${S.ledger.length}/${N} attests`, x0, 580);
  ctx.fillStyle = '#2dd4bf';
  S.ledger.slice(-14).forEach((k, j) =>
    ctx.fillText((line[k].net > 0 ? '+' : '') + line[k].net, x0 + 170 + j * 52, 580));

  step();
  requestAnimationFrame(draw);
}
const PAIRS = [[1, 1], [1, 0], [0, 1], [0, 0]];
const DROPS = ['off', 'A', 'B', 'both'];
let pi = 0, di = 0;
const bM = document.getElementById('bMoniker');
const bD = document.getElementById('bDrop');
const bR = document.getElementById('bReplay');
bM.onclick = () => { pi = (pi + 1) % PAIRS.length;
  bM.textContent = 'moniker: ' + PAIRS[pi].join(''); S = newRun(PAIRS[pi], DROPS[di]); };
bD.onclick = () => { di = (di + 1) % DROPS.length;
  bD.textContent = 'drop: ' + DROPS[di]; bD.classList.toggle('on', di !== 0);
  S = newRun(PAIRS[pi], DROPS[di]); };
bR.onclick = () => { S = newRun(PAIRS[pi], DROPS[di]); };
S = newRun(PAIRS[0], DROPS[0]);
requestAnimationFrame(draw);
</script>
</body>
</html>
