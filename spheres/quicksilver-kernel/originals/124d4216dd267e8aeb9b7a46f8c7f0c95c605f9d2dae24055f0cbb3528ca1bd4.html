// living-dreams engine — the living kernel dreaming in high fantasy.
// Every visible thing is derived deterministically from the kernel snapshot:
// 18 foam cells -> 18 stars (H gold, O teal, N violet; mag -> brightness,
// phase -> twinkle). Wave phase -> moon. Verdicts -> rune stones. Sapphon
// emissions -> embers. Battery -> ambient glow. The stillpoint -> the still
// lake: a perfect mirror, because the quiet water is the zero that doesn't
// move. Agentic: the dream re-reads the kernel and repaints on its own.
(function () {
'use strict';

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var LAYER_COLOR = { H: [255, 214, 74], O: [94, 242, 208], N: [186, 97, 255] };
var RUNE_COLOR = { a: '#5dff91', b: '#4acbff', c: '#ffd64a', d: '#ff5fcb' };

function dreamParams(K, dreamTick) {
  var rng = mulberry32((K.tick + dreamTick) >>> 0);
  var cells = [];
  ['H', 'O', 'N'].forEach(function (L) {
    K.foam[L].forEach(function (c, i) {
      cells.push({ layer: L, idx: i, mag: c.mag, phase: c.phase });
    });
  });
  var verdicts = (K.verdicts || []).slice(-4);
  return {
    seed: (K.tick + dreamTick) >>> 0,
    tick: K.tick + dreamTick,
    rng: rng,
    cells: cells,
    wavePhase: K.wave ? K.wave.phase : 0,
    breaks: K.wave ? K.wave.breaks : 0,
    battery: K.battery ? K.battery.charge : 0,
    verdicts: verdicts,
    embers: Math.min(42, (K.foam.pops.H + K.foam.pops.O + K.foam.pops.N) % 97),
    still: K.stillpoint && K.stillpoint.held ? K.stillpoint : null,
    crestEcho: ((K.tick + dreamTick) % 52) < 6,
  };
}

// 1D value noise for ridgelines
function ridgeNoise(rng, n, oct) {
  var grids = [];
  for (var o = 0; o < oct; o++) {
    var g = [], m = 4 * (o + 1);
    for (var i = 0; i <= m; i++) g.push(rng());
    grids.push({ g: g, m: m });
  }
  return function (x) { // x in [0,1]
    var v = 0, amp = 1, tot = 0;
    for (var o = 0; o < grids.length; o++) {
      var gr = grids[o], fx = x * gr.m, i0 = Math.floor(fx), f = fx - i0;
      var a = gr.g[i0 % gr.g.length], b = gr.g[(i0 + 1) % gr.g.length];
      var s = f * f * (3 - 2 * f);
      v += (a + (b - a) * s) * amp; tot += amp; amp *= 0.5;
    }
    return v / tot;
  };
}

function paintStatic(off, P, W, H) {
  var c = off.getContext('2d');
  var rng = P.rng;

  // --- sky ---
  var sky = c.createLinearGradient(0, 0, 0, H * 0.72);
  sky.addColorStop(0, '#04060f');
  sky.addColorStop(0.55, '#0a1230');
  sky.addColorStop(0.85, '#123a4a');
  sky.addColorStop(1, '#0e4a4a');
  c.fillStyle = sky;
  c.fillRect(0, 0, W, H * 0.72);

  // --- moon (the wave) ---
  var mx = W * (0.12 + 0.76 * P.wavePhase);
  var my = H * 0.24 - Math.sin(P.wavePhase * Math.PI) * H * 0.09;
  var mr = Math.min(W, H) * 0.085;
  var glow = c.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 3.2);
  glow.addColorStop(0, 'rgba(255,236,170,0.5)');
  glow.addColorStop(1, 'rgba(255,236,170,0)');
  c.fillStyle = glow;
  c.fillRect(mx - mr * 3.2, my - mr * 3.2, mr * 6.4, mr * 6.4);
  c.fillStyle = '#f5e6b8';
  c.beginPath(); c.arc(mx, my, mr, 0, 7); c.fill();
  // phase shadow
  c.fillStyle = 'rgba(6,10,24,0.88)';
  c.beginPath();
  c.arc(mx + mr * 1.1 * (0.5 - P.wavePhase), my - mr * 0.25, mr * 0.96, 0, 7);
  c.fill();
  c.fillStyle = 'rgba(245,230,184,0.25)';
  c.beginPath(); c.arc(mx, my, mr, 0, 7); c.fill();

  // --- mountains: three ridges, verdicts choose the accent ---
  var bases = [0.62, 0.66, 0.70], cols = ['#131a3d', '#0d1430', '#080d24'];
  for (var l = 0; l < 3; l++) {
    var nz = ridgeNoise(rng, 0, 3);
    c.fillStyle = cols[l];
    c.beginPath();
    c.moveTo(0, H * bases[l] + 40);
    for (var x = 0; x <= W; x += 8) {
      var y = H * bases[l] - nz(x / W) * H * (0.16 - l * 0.03);
      c.lineTo(x, y);
    }
    c.lineTo(W, H * bases[l] + 40);
    c.closePath(); c.fill();
  }

  // --- the still lake: a perfect mirror, because the zero doesn't move ---
  var ly = H * 0.70;
  c.save();
  c.beginPath(); c.rect(0, ly, W, H - ly); c.clip();
  c.globalAlpha = 0.32;
  c.translate(0, 2 * ly); c.scale(1, -1);
  c.drawImage(off, 0, 0, W, ly, 0, 0, W, ly);
  c.restore();
  var lk = c.createLinearGradient(0, ly, 0, H);
  lk.addColorStop(0, 'rgba(6,14,26,0.55)');
  lk.addColorStop(1, 'rgba(3,7,16,0.94)');
  c.fillStyle = lk;
  c.fillRect(0, ly, W, H - ly);
  // the held ring reflected: 18 still stars in a toroid on the water
  if (P.still && P.still.pattern) {
    var cx = W / 2, cy = ly + (H - ly) * 0.42, rr = Math.min(W, H) * 0.10;
    var wg = c.createRadialGradient(cx, cy, 2, cx, cy, rr * 2.4);
    wg.addColorStop(0, 'rgba(150,230,255,0.35)');
    wg.addColorStop(1, 'rgba(150,230,255,0)');
    c.fillStyle = wg;
    c.fillRect(cx - rr * 2.4, cy - rr * 2.4, rr * 4.8, rr * 4.8);
    P.still.pattern.forEach(function (s, i) {
      var a = (i / 18) * Math.PI * 2 - Math.PI / 2;
      var sx = cx + Math.cos(a) * rr, sy = cy + Math.sin(a) * rr * 0.45;
      c.fillStyle = 'rgba(190,240,255,' + (0.35 + s.mag * 0.6).toFixed(2) + ')';
      c.beginPath(); c.arc(sx, sy, 1 + s.mag * 2.4, 0, 7); c.fill();
    });
    c.fillStyle = 'rgba(220,250,255,0.9)';
    c.beginPath(); c.arc(cx, cy, 2.5, 0, 7); c.fill(); // the zero
  }

  // --- rune stones: the last verdicts, carved in the foreground ---
  var stones = Math.min(4, P.verdicts.length);
  for (var s = 0; s < stones; s++) {
    var v = P.verdicts[P.verdicts.length - 1 - s];
    var sx = W * (0.12 + s * 0.25) + (rng() - 0.5) * 30;
    var sy = H * 0.94;
    var col = RUNE_COLOR[v.label] || '#9fd8ff';
    c.fillStyle = '#0a0f1e';
    c.beginPath(); c.ellipse(sx, sy, 26, 34, 0, 0, 7); c.fill();
    c.strokeStyle = col; c.globalAlpha = 0.9; c.lineWidth = 2;
    c.shadowColor = col; c.shadowBlur = 12;
    var gx = sx, gy = sy - 6;
    c.beginPath();
    if (v.label === 'a') { c.moveTo(gx - 8, gy + 10); c.lineTo(gx, gy - 10); c.lineTo(gx + 8, gy + 10); }
    else if (v.label === 'b') { c.arc(gx, gy, 9, 0, 7); }
    else if (v.label === 'c') { c.moveTo(gx - 9, gy); c.lineTo(gx + 9, gy); c.moveTo(gx, gy - 9); c.lineTo(gx, gy + 9); }
    else { c.moveTo(gx, gy - 10); c.lineTo(gx + 8, gy); c.lineTo(gx, gy + 10); c.lineTo(gx - 8, gy); c.closePath(); }
    c.stroke();
    c.shadowBlur = 0; c.globalAlpha = 1;
  }

  // --- crest echo: the wave's shimmer band ---
  if (P.crestEcho) {
    var sh = c.createLinearGradient(0, 0, W, H * 0.5);
    sh.addColorStop(0, 'rgba(140,240,255,0)');
    sh.addColorStop(0.5, 'rgba(140,240,255,0.10)');
    sh.addColorStop(1, 'rgba(140,240,255,0)');
    c.fillStyle = sh;
    c.fillRect(0, 0, W, H * 0.6);
  }

  // --- caption ---
  c.fillStyle = 'rgba(160,200,220,0.55)';
  c.font = '11px monospace';
  c.fillText('living kernel · tick ' + P.tick + ' · wave ' + P.wavePhase.toFixed(2) +
    ' · ' + P.verdicts.length + ' verdicts · ' + (P.still ? 'stillpoint holding' : 'stillpoint empty') +
    ' · battery ' + Math.round(P.battery * 100) + '%', 12, H - 12);
}

function paintFrame(ctx, off, P, W, H, t, fade) {
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.drawImage(off, 0, 0);
  // living stars: 18 kernel stars, twinkling on their phases
  P.cells.forEach(function (st, i) {
    if (!st._p) {
      var r = P.rng;
      st._p = { x: r() * W, y: r() * H * 0.52, tw: st.phase };
    }
    var tw = 0.55 + 0.45 * Math.sin(t * 1.4 + st._p.tw * 4);
    var rad = 0.7 + Math.min(1, st.mag * 3) * 2.4;
    var col = LAYER_COLOR[st.layer];
    ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' +
      (tw * (0.35 + Math.min(1, st.mag * 2.5))).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(st._p.x, st._p.y, rad, 0, 7); ctx.fill();
  });
  // embers: sapphon refugees drifting up
  for (var e = 0; e < P.embers; e++) {
    if (!P._emb) P._emb = [];
    if (!P._emb[e]) {
      var r2 = P.rng;
      P._emb[e] = { x: r2() * W, y: H * 0.5 + r2() * H * 0.4, s: 0.3 + r2() * 0.9, o: r2() * 9 };
    }
    var em = P._emb[e];
    var ey = em.y - ((t * 12 * em.s + em.o * 40) % (H * 0.75));
    var ex = em.x + Math.sin(t * 0.8 + em.o) * 14;
    ctx.fillStyle = 'rgba(255,180,110,' + (0.5 + 0.3 * Math.sin(t * 2 + em.o)).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(ex, ey, 1.4, 0, 7); ctx.fill();
  }
  if (fade > 0) { ctx.fillStyle = 'rgba(4,6,15,' + fade.toFixed(2) + ')'; ctx.fillRect(0, 0, W, H); }
}

window.LivingDreams = {
  dreamParams: dreamParams,
  paintStatic: paintStatic,
  paintFrame: paintFrame,
};
})();

</script>

(function () {

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var off = document.createElement('canvas');
  var W = 0, H = 0, P = null, dreamTick = 0, fade = 1;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    off.width = W; off.height = H;

  function repaint() {
    // agentic: each dream-cycle the kernel advances one full wave (52 ticks)
    P = LivingDreams.dreamParams(K, dreamTick);
    // clear per-frame caches so the new dream lays its own stars
    P.cells.forEach(function (st) { delete st._p; });
    delete P._emb;
    LivingDreams.paintStatic(off, P, W, H);
    fade = 1; // crossfade in from the dark
  }

  var t0 = performance.now();
  function frame(now) {
    var t = (now - t0) / 1000;
    if (fade > 0) fade = Math.max(0, fade - 0.008);
    LivingDreams.paintFrame(ctx, off, P, W, H, t, fade);
    requestAnimationFrame(frame);
  }

  // the dream continues on its own: a new painting every 14 seconds
  setInterval(function () {
    dreamTick += 52;
    repaint();
  }, 14000);

  document.getElementById('veil').style.display = 'none';
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
