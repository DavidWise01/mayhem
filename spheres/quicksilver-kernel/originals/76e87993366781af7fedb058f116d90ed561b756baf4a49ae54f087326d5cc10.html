<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quicksilver arc — dog on a leash, cubits in tow</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070f; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { width: min(1000px, 100vw); }
  canvas { width: 100%; height: auto; display: block; }
  #bar { display: flex; gap: 8px; padding: 10px 12px; flex-wrap: wrap; align-items: center; }
  button { background: #0e1626; color: #9fd8e8; border: 1px solid #1f3a4d; border-radius: 8px;
           padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #16233a; }
  button.on { border-color: #2dd4bf; color: #2dd4bf; }
  #note { color: #5b6b82; font-size: 12px; padding: 0 12px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1000" height="660"></canvas>
  <div id="bar">
    <button id="bMoniker" class="on">moniker: 11</button>
    <button id="bDrop">drop: off</button>
    <button id="bReplay">replay</button>
  </div>
  <div id="note">plank-line 51/51 · dog on a leash tethered to end{}, both 1/2 cubits in tow (−4 bubbles) · delivery when the tow arrives · dark pixel = delivered 0 or lost — the ledger says which</div>
</div>
<script>
'use strict';
// Isomorph of ~/workspace/plank-bubbles/plank-line.js: the dog runs to end{}
// on its leash; both 1/2 cubits come in tow behind it; delivery when the tow
// arrives, TOW_LAG bubbles after the dog.
const N = 52, TOW_LAG = 4;
const SEED = 7;
function rng32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const line = [];
{
  const rng = rng32(SEED);
  for (let i = 0; i < N; i++) {
    const up = i % 2 === 0;
    line.push({ i, net: up ? 98 : -98, cross: rng() < 0.01 });
  }
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const yLine = 190, x0 = 70, x1 = W - 230, dx = (x1 - x0) / (N - 1), R = 11;
const yThread = [350, 386];
const pxX = W - 180, pxY = yLine - 34, pxS = 60, pxGap = 12;
const endX = pxX + pxS + pxGap / 2, endY = pxY + pxS / 2; // end{}

let S;
function newRun(pair, dropMode) {
  const rng = rng32(SEED + pair[0] * 2 + pair[1]);
  const dropAt = dropMode === 'off' ? -1 : 10 + Math.floor(rng() * (N - 20));
  const c0 = x0 - TOW_LAG * dx;
  return { pair: [pair[0], pair[1]], bits: [pair[0], pair[1]], pos: -1,
           cpos: [c0, c0], hist: new Array(24).fill(c0), delivered: true, ledger: [],
           dropAt, dropMode, lost: [-1, -1], phase: 'travel', flash: new Array(N).fill(0) };
}
function step() {
  if (S.phase === 'done') return;
  if (S.pos < N - 1) S.pos = Math.min(S.pos + 0.35, N - 1); // the dog runs; the leash holds it at end{}
  const k = Math.floor(S.pos);
  if (k >= 0 && !S.ledger.includes(k)) {
    S.ledger.push(k); S.flash[k] = 1;
    if (k === S.dropAt) {
      const drop = S.dropMode === 'both' ? [0, 1] : [S.dropMode === 'A' ? 0 : 1];
      drop.forEach(d => { S.bits[d] = -1; S.lost[d] = k; });
      S.delivered = false;
    }
  }
  for (let i = 0; i < N; i++) S.flash[i] *= 0.94;
  // the tow follows the dog's delayed trajectory: the cubits are where the
  // dog was ~12 frames (~4 bubbles) ago — in tow, and they do arrive
  const dogX = x0 + Math.max(0, Math.min(S.pos, N - 1)) * dx;
  S.hist.push(dogX);
  if (S.hist.length > 64) S.hist.shift();
  const target = S.hist[Math.max(0, S.hist.length - 1 - 12)];
  S.cpos[0] += (target - S.cpos[0]) * 0.16;
  S.cpos[1] += (target - S.cpos[1]) * 0.16;
  if (S.pos >= N - 1 && S.cpos[0] >= x1 - 4 && S.cpos[1] >= x1 - 4) S.phase = 'done';
}
function bubbleColor(net, flash, cross) {
  const base = net > 0 ? [212, 175, 55] : [139, 92, 246];
  const f = Math.min(1, flash + (cross ? 0.25 : 0));
  return `rgb(${base.map(v => Math.round(v + (255 - v) * f * 0.7)).join(',')})`;
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070b16'); g.addColorStop(1, '#04060d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8fa3bd'; ctx.font = '15px system-ui';
  ctx.fillText('packed line — 52 Planck bubbles, alternating 99u1d / 99d1up', x0, 40);
  ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
  ctx.fillText('plank-line 51/51 · dog on a leash → end{}, both 1/2 cubits in tow', x0, 62);

  for (let i = 0; i < N; i++) {
    const x = x0 + i * dx, b = line[i];
    ctx.beginPath(); ctx.arc(x, yLine, R, 0, 7);
    ctx.fillStyle = bubbleColor(b.net, S.flash[i], b.cross && Math.abs(S.pos - i) < 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,180,210,0.25)'; ctx.stroke();
    if (S.ledger.includes(i)) {
      ctx.fillStyle = '#2dd4bf'; ctx.font = '10px system-ui';
      ctx.fillText('✓', x - 3, yLine - R - 6);
    }
  }
  const dogX = x0 + Math.max(0, Math.min(S.pos, N - 1)) * dx;
  // the leash: dog → end{}
  ctx.strokeStyle = 'rgba(212,175,55,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(dogX, yLine - 12); ctx.lineTo(endX, endY); ctx.stroke();
  ctx.fillStyle = 'rgba(212,175,55,0.8)'; ctx.font = '12px system-ui';
  ctx.fillText('leash → end{}', (dogX + endX) / 2 - 30, (yLine - 12 + endY) / 2 - 8);
  // the dog
  {
    const ag = ctx.createRadialGradient(dogX, yLine, 0, dogX, yLine, 26);
    ag.addColorStop(0, 'rgba(45,212,191,0.9)'); ag.addColorStop(1, 'rgba(45,212,191,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(dogX, yLine, 26, 0, 7); ctx.fill();
    ctx.fillStyle = '#eafffb'; ctx.beginPath(); ctx.arc(dogX, yLine, 5, 0, 7); ctx.fill();
  }
  // the tow rope: dog's tail → cubits, with slack
  const midX = (S.cpos[0] + S.cpos[1]) / 2, midY = (yThread[0] + yThread[1]) / 2;
  ctx.strokeStyle = 'rgba(45,212,191,0.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(dogX - 8, yLine + 10);
  ctx.quadraticCurveTo((dogX + midX) / 2, yLine + 66, midX, midY); ctx.stroke();
  // the cubits in tow on their threads
  const labels = ['A', 'B'];
  yThread.forEach((yt, d) => {
    ctx.strokeStyle = 'rgba(45,212,191,0.3)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0 - 60, yt); ctx.lineTo(x1, yt); ctx.stroke();
    if (S.bits[d] !== -1) {
      ctx.fillStyle = S.pair[d] ? '#ffffff' : '#1f6f65';
      ctx.beginPath(); ctx.arc(S.cpos[d], yt, 6, 0, 7); ctx.fill();
      ctx.fillStyle = '#2dd4bf'; ctx.font = '12px system-ui';
      ctx.fillText('cubit ' + labels[d] + ' · in tow', S.cpos[d] + 10, yt + 4);
    } else if (S.lost[d] >= 0) {
      const lx = x0 + S.lost[d] * dx;
      ctx.fillStyle = '#f87171'; ctx.font = '13px system-ui';
      ctx.fillText('cubit ' + labels[d] + ' lost', lx - 28, yt - 14);
    }
  });
  ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
  ctx.fillText('tow −4 bubbles · quicksilver pair · ~1.1502e-36 m · under the 1% cross-talk floor', x0 - 40, yThread[1] + 30);

  // end{}: the 2px
  const px = (d) => {
    const X = pxX + d * (pxS + pxGap);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(X, pxY, pxS, pxS);
    ctx.strokeStyle = '#d4af37'; ctx.strokeRect(X, pxY, pxS, pxS);
    if (S.phase === 'done' && S.bits[d] !== -1) {
      ctx.fillStyle = S.pair[d] ? '#eafffb' : '#123f3a';
      ctx.fillRect(X + 4, pxY + 4, pxS - 8, pxS - 8);
    }
    ctx.fillStyle = '#8fa3bd'; ctx.font = '14px system-ui';
    ctx.fillText('1px ' + labels[d], X + 12, pxY + pxS + 22);
  };
  px(0); px(1);
  ctx.fillStyle = '#d4af37'; ctx.font = '13px system-ui';
  ctx.fillText('end{}', endX - 16, pxY - 10);

  if (S.phase !== 'done' && S.pos >= N - 1) {
    ctx.fillStyle = '#d4af37'; ctx.font = '15px system-ui';
    ctx.fillText('dog at end{} — cubits still in tow…', x0, 500);
  }
  if (S.phase === 'done') {
    ctx.font = '15px system-ui';
    const shown = S.bits.map(b => b < 0 ? 0 : b).join('');
    if (S.delivered) {
      ctx.fillStyle = '#2dd4bf';
      ctx.fillText(`tow arrived: pair ${S.pair.join('')} → 2px ${shown} · ledger ${S.ledger.length}/${N} attests`, x0, 500);
      if (shown.includes('0')) {
        ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
        ctx.fillText('dark pixel, full ledger — a delivered 0, not a loss. the ledger says which.', x0, 524);
      }
    } else {
      ctx.fillStyle = '#f87171';
      ctx.fillText(`lost ${S.dropMode === 'both' ? 'both cubits' : 'cubit ' + S.dropMode} → 2px ${shown} · no receipt (ledger kept walking: ${S.ledger.length}/${N})`, x0, 500);
    }
  }
  ctx.fillStyle = '#5b6b82'; ctx.font = '13px system-ui';
  ctx.fillText(`ledger: ${S.ledger.length}/${N} attests`, x0, 590);
  ctx.fillStyle = '#2dd4bf';
  S.ledger.slice(-14).forEach((k, j) =>
    ctx.fillText((line[k].net > 0 ? '+' : '') + line[k].net, x0 + 170 + j * 52, 590));

  step();
  requestAnimationFrame(draw);
}
const PAIRS = [[1, 1], [1, 0], [0, 1], [0, 0]];
const DROPS = ['off', 'A', 'B', 'both'];
let pi = 0, di = 0;
const bM = document.getElementById('bMoniker');
const bD = document.getElementById('bDrop');
const bR = document.getElementById('bReplay');
bM.onclick = () => { pi = (pi + 1) % PAIRS.length;
  bM.textContent = 'moniker: ' + PAIRS[pi].join(''); S = newRun(PAIRS[pi], DROPS[di]); };
bD.onclick = () => { di = (di + 1) % DROPS.length;
  bD.textContent = 'drop: ' + DROPS[di]; bD.classList.toggle('on', di !== 0);
  S = newRun(PAIRS[pi], DROPS[di]); };
bR.onclick = () => { S = newRun(PAIRS[pi], DROPS[di]); };
S = newRun(PAIRS[0], DROPS[0]);
requestAnimationFrame(draw);
</script>
</body>
</html>
