<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=helix-366-world.html"><title>Moved: The Helix 366 World</title><style id="cubit-neon">
:root{--neon-cyan:#00f0ff;--neon-pink:#ff2bd6;--neon-amber:#ffb300}
html,body{background:#030308;color:#d7e3f5;font-family:ui-monospace,Menlo,monospace}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 400px at 20% 10%, rgba(0,240,255,.06), transparent 70%),
  radial-gradient(700px 500px at 80% 90%, rgba(255,43,214,.05), transparent 70%)}
main,#wrap{position:relative;z-index:1;background:rgba(5,8,16,.78);color:#d7e3f5;
  border:1px solid rgba(0,240,255,.18);border-radius:14px;
  box-shadow:0 0 34px rgba(0,240,255,.07), inset 0 0 60px rgba(0,0,0,.45)}
#wrap{max-width:1340px;margin:0 auto;padding:34px 18px 50px;text-align:center}
h1{font-size:26px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:#eaf6ff;
  text-shadow:0 0 8px var(--neon-cyan), 0 0 28px rgba(0,240,255,.7);animation:cubitflicker 7s infinite}
#sub{font-size:11px;letter-spacing:.3em;color:#5f7396;text-transform:uppercase;margin-bottom:26px}
#sub b{color:var(--neon-pink);font-weight:400;text-shadow:0 0 10px var(--neon-pink)}
#stage{display:flex;gap:26px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.panel{border:1px solid rgba(0,240,255,.18);border-radius:14px;padding:18px 14px 14px;
  background:rgba(5,8,16,.72);box-shadow:0 0 34px rgba(0,240,255,.07), inset 0 0 60px rgba(0,0,0,.5);
  flex:1 1 420px;max-width:640px;text-align:left}
.panel.neon{border-color:rgba(255,43,214,.25);box-shadow:0 0 34px rgba(255,43,214,.08), inset 0 0 60px rgba(0,0,0,.5)}
.panel h2{font-size:12px;font-weight:400;letter-spacing:.4em;text-transform:uppercase;margin:0 0 2px;color:#a5e8eb}
.panel.neon h2{color:#ffb3ec;text-shadow:0 0 12px var(--neon-pink)}
.panel .tag{font-size:10px;letter-spacing:.12em;color:#5f7396;text-transform:uppercase;margin-bottom:12px}
#v3{background:#05070d;border-radius:14px;box-shadow:0 0 0 3px var(--neon-pink), 0 0 28px rgba(255,43,214,.25)}
button{font-family:inherit;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:#a5e8eb;
  border:1px solid rgba(0,240,255,.4);border-radius:18px;box-shadow:0 0 12px rgba(0,240,255,.15)}
button:hover{background:rgba(0,240,255,.1)}
#controls{margin-top:26px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
a{color:var(--neon-cyan)}
code{color:#ffb3ec}
section{background:rgba(5,8,16,.55);border:1px solid rgba(255,43,214,.25);color:#d7e3f5}
.card{background:rgba(5,8,16,.78);color:#d7e3f5;border:1px solid rgba(0,240,255,.18)}
.th{background:#030308}
#board,#chart{background:rgba(5,8,16,.85);color:#d7e3f5}
main p,main li,#wrap p,#wrap li{color:#d7e3f5}
h2,h3{color:#a5e8eb}
.q{border-left-color:var(--neon-pink)}
body.thumb main,body.thumb #wrap{background:#030308;box-shadow:none;border:0}
body.thumb .panel:not(.neon),body.thumb #sub,body.thumb #controls,body.thumb .essay{display:none}
body.thumb #stage{display:block}
body.thumb #v3{height:78vh}
@keyframes cubitflicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}97%{opacity:.85}98%{opacity:1}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style></head><body style="background:#0a0612;color:#eee;font-family:Georgia,serif;padding:2em"><p>This page moved after Dave's t240 correction ("sorry its element 118 the orgen"). Go to <a href="helix-366-world.html" style="color:#c4b5fd">The Helix 366 World</a>.</p></body></html>
